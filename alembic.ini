# Alembic configuration (schema migrations only; never used at application runtime).
# Usage from the project root:
#   python -m alembic upgrade head
# The connection string is NOT stored here: env.py reads DATABASE_URL (or a URL injected by the caller).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Intentionally empty: the real DSN (with password) lives only in the DATABASE_URL env var.
sqlalchemy.url =

[post_write_hooks]

# Logging: affects the alembic command only; the app configures its own logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
